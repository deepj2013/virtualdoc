version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: virtualdoc-postgres
    environment:
      POSTGRES_DB: virtualdoc
      POSTGRES_USER: virtualdoc
      POSTGRES_PASSWORD: virtualdoc123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - virtualdoc-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: virtualdoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - virtualdoc-network
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: virtualdoc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # MinIO for file storage
  minio:
    image: minio/minio:latest
    container_name: virtualdoc-minio
    environment:
      MINIO_ROOT_USER: virtualdoc
      MINIO_ROOT_PASSWORD: virtualdoc123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Common Services
  auth-service:
    build:
      context: ./backend/common/auth-service
      dockerfile: Dockerfile
    container_name: virtualdoc-auth-service
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  user-service:
    build:
      context: ./backend/common/user-service
      dockerfile: Dockerfile
    container_name: virtualdoc-user-service
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./backend/common/notification-service
      dockerfile: Dockerfile
    container_name: virtualdoc-notification-service
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  file-service:
    build:
      context: ./backend/common/file-service
      dockerfile: Dockerfile
    container_name: virtualdoc-file-service
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=virtualdoc
      - MINIO_SECRET_KEY=virtualdoc123
    ports:
      - "3004:3004"
    depends_on:
      - postgres
      - minio
    networks:
      - virtualdoc-network
    restart: unless-stopped

  audit-service:
    build:
      context: ./backend/common/audit-service
      dockerfile: Dockerfile
    container_name: virtualdoc-audit-service
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - elasticsearch
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Specific Services
  patient-service:
    build:
      context: ./backend/specific/patient-service
      dockerfile: Dockerfile
    container_name: virtualdoc-patient-service
    environment:
      - NODE_ENV=development
      - PORT=4001
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  appointment-service:
    build:
      context: ./backend/specific/appointment-service
      dockerfile: Dockerfile
    container_name: virtualdoc-appointment-service
    environment:
      - NODE_ENV=development
      - PORT=4002
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
    ports:
      - "4002:4002"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  medical-records-service:
    build:
      context: ./backend/specific/medical-records-service
      dockerfile: Dockerfile
    container_name: virtualdoc-medical-records-service
    environment:
      - NODE_ENV=development
      - PORT=4003
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
    ports:
      - "4003:4003"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  billing-service:
    build:
      context: ./backend/specific/billing-service
      dockerfile: Dockerfile
    container_name: virtualdoc-billing-service
    environment:
      - NODE_ENV=development
      - PORT=4004
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
    ports:
      - "4004:4004"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./backend/specific/inventory-service
      dockerfile: Dockerfile
    container_name: virtualdoc-inventory-service
    environment:
      - NODE_ENV=development
      - PORT=4005
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - REDIS_URL=redis://redis:6379
    ports:
      - "4005:4005"
    depends_on:
      - postgres
      - redis
    networks:
      - virtualdoc-network
    restart: unless-stopped

  reporting-service:
    build:
      context: ./backend/specific/reporting-service
      dockerfile: Dockerfile
    container_name: virtualdoc-reporting-service
    environment:
      - NODE_ENV=development
      - PORT=4006
      - DATABASE_URL=postgresql://virtualdoc:virtualdoc123@postgres:5432/virtualdoc
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    ports:
      - "4006:4006"
    depends_on:
      - postgres
      - elasticsearch
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # API Gateway
  nginx:
    image: nginx:alpine
    container_name: virtualdoc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - auth-service
      - user-service
      - notification-service
      - file-service
      - audit-service
      - patient-service
      - appointment-service
      - medical-records-service
      - billing-service
      - inventory-service
      - reporting-service
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Frontend Services
  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    container_name: virtualdoc-web-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost
    networks:
      - virtualdoc-network
    restart: unless-stopped

  patient-portal:
    build:
      context: ./frontend/patient-portal
      dockerfile: Dockerfile
    container_name: virtualdoc-patient-portal
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost
    networks:
      - virtualdoc-network
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      dockerfile: Dockerfile
    container_name: virtualdoc-admin-dashboard
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: virtualdoc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - virtualdoc-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: virtualdoc-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - virtualdoc-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  virtualdoc-network:
    driver: bridge
