services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: virtualdoc-postgres
    environment:
      POSTGRES_DB: virtualdoc
      POSTGRES_USER: virtualdoc
      POSTGRES_PASSWORD: virtualdoc123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Cache
  redis:
    image: redis:7-alpine
    container_name: virtualdoc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Frontend - React + Vite + Tailwind CSS
  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    container_name: virtualdoc-web-app
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:3001
    networks:
      - virtualdoc-network
    restart: unless-stopped

  # Simple Mock API for development
  mock-api:
    image: mockserver/mockserver:latest
    container_name: virtualdoc-mock-api
    ports:
      - "3001:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock-api.json
    volumes:
      - ./mock-api.json:/config/mock-api.json:ro
    networks:
      - virtualdoc-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  virtualdoc-network:
    driver: bridge
